# Render blueprint for the FastAPI backend.
#
# The frontend is not here: it is a static build on Vercel whose /api and /uploads
# rewrites forward to this service. Keep VITE_API_BASE_URL=/api/v1 so cookies
# share the frontend origin, and update both proxy destinations in vercel.json
# when this service's hostname changes.

services:
  - type: web
    name: school-results-portal-api
    runtime: python
    plan: free
    region: frankfurt          # nearest of Render's regions to Zimbabwe
    branch: main
    rootDir: backend

    # init_db creates missing tables. The progression migration then upgrades
    # databases created before permanent student numbers and annual enrollment
    # history were introduced (including students.admission_year). Both steps
    # are idempotent and preserve existing users, students and results.
    buildCommand: >-
      pip install -r requirements.txt && python -m scripts.init_db &&
      python -m scripts.migrate_permanent_numbers_progression

    # --proxy-headers so the application sees the real client address through
    # Render's router rather than the router's own, which the rate limiter
    # depends on to tell callers apart.
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'

    healthCheckPath: /api/v1/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # Everything below is set in the Render dashboard, never in this file.
      # sync: false keeps the blueprint from overwriting them on each deploy.
      # Use a SQLAlchemy URL for the hosted database, for example
      # mysql+pymysql://USER:PASSWORD@HOST:3306/DATABASE?charset=utf8mb4.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS       # the Vercel site, e.g. https://portal.vercel.app
        sync: false
      - key: FRONTEND_URL       # same URL; used for sign-in links in emails
        sync: false
      # Render's free instances block outbound SMTP (ports 25, 465, 587), and
      # a blocked port hangs until the timeout rather than failing. Email goes
      # through Brevo's HTTPS API instead, which needs no host, port or TLS
      # settings - only an API key.
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: BREVO_API_KEY      # xkeysib-... from Brevo -> SMTP & API -> API Keys
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: SCHOOL_NAME
        sync: false
      - key: SCHOOL_MOTTO
        sync: false
      - key: STUDENT_EMAIL_DOMAIN
        sync: false
      - key: ADMIN_EMAIL        # first admin; remove after the first deploy
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
